<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>داشبورد کارهای من</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#07111f;--card:rgba(18,31,51,.82);--line:rgba(255,255,255,.09);--text:#f4f7fb;--muted:#91a0b5;--accent:#65a9ff;--danger:#ff6f7d;--ok:#55d6a2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#16335b 0,transparent 35%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:18px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.title{font-size:24px;font-weight:800}.sub{color:var(--muted);font-size:13px;margin-top:5px}.pill{border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:14px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px}.stat b{font-size:23px;display:block}.stat span{font-size:11px;color:var(--muted)}.section{margin-top:14px}.section h2{font-size:15px;margin:0 0 9px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:9px}.row{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}.task-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:11px;margin-top:6px}.badge{font-size:10px;padding:5px 8px;border-radius:10px;background:rgba(101,169,255,.12);color:#9bc9ff}.actions{display:flex;gap:7px;margin-top:10px}.btn{border:1px solid var(--line);background:#14243b;color:var(--text);border-radius:12px;padding:9px 11px;cursor:pointer}.btn.primary{background:var(--accent);color:#06101e;border-color:transparent;font-weight:700}.btn.danger{color:#ffadb6}.fab{position:fixed;left:18px;bottom:18px;border:0;border-radius:17px;padding:14px 17px;background:var(--accent);color:#06101e;font-size:15px;font-weight:800;box-shadow:0 10px 35px rgba(0,0,0,.35)}.empty{text-align:center;color:var(--muted);padding:25px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;padding:10px}.modal.show{display:flex}.sheet{width:min(760px,100%);background:#0c1829;border:1px solid var(--line);border-radius:24px;padding:18px;max-height:90vh;overflow:auto}.field{margin-bottom:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:#07111f;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit}.field textarea{min-height:90px;resize:vertical}.form-actions{display:flex;gap:8px}.notice{font-size:12px;color:#ffcc75;display:none;margin-bottom:10px}.notice.show{display:block}@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}.title{font-size:21px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><div><div class="title">داشبورد کارهای من</div><div class="sub" id="hello">در حال بارگذاری…</div></div><div class="pill" id="status">اتصال…</div></div>
  <div class="notice" id="notice"></div>
  <div class="grid"><div class="stat"><b id="all">0</b><span>همه کارها</span></div><div class="stat"><b id="today">0</b><span>امروز</span></div><div class="stat"><b id="overdue">0</b><span>عقب‌افتاده</span></div><div class="stat"><b id="done">0</b><span>انجام‌شده</span></div></div>
  <section class="section"><h2>نیاز به توجه</h2><div id="attention"></div></section>
  <section class="section"><h2>امروز</h2><div id="todayList"></div></section>
  <section class="section"><h2>آینده</h2><div id="future"></div></section>
</main>
<button class="fab" id="add">＋ ثبت کار جدید</button>
<div class="modal" id="modal"><div class="sheet"><h2 id="formTitle">ثبت کار جدید</h2><form id="form"><input type="hidden" id="editId"><div class="field"><label>عنوان</label><input id="title" required maxlength="200"></div><div class="field"><label>توضیحات</label><textarea id="description"></textarea></div><div class="field"><label>اولویت</label><select id="priority"><option value="normal">عادی</option><option value="high">مهم</option><option value="urgent">خیلی مهم</option></select></div><div class="field"><label>تاریخ و ساعت سررسید</label><input id="due" type="datetime-local"></div><div class="form-actions"><button class="btn primary" type="submit">ذخیره</button><button class="btn" type="button" id="close">انصراف</button></div></form></div></div>
<script>
const API_BASE_URL='https://mytelegrambot-api.a-behrouzvaziri70.workers.dev';
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
const $=id=>document.getElementById(id);let tasks=[];
function showNotice(x){$('notice').textContent=x;$('notice').classList.add('show')}
function localDate(s){if(!s)return null;const d=new Date(s);return isNaN(d)?null:d}
function fmt(s){const d=localDate(s);return d?d.toLocaleString('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'بدون مهلت'}
function isToday(d){const n=new Date();return d&&d.getFullYear()==n.getFullYear()&&d.getMonth()==n.getMonth()&&d.getDate()==n.getDate()}
function card(t){const d=localDate(t.due_date);const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="row"><div class="grow"><div class="task-title"></div><div class="meta"></div></div><span class="badge">${t.priority==='urgent'?'خیلی مهم':t.priority==='high'?'مهم':'عادی'}</span></div><div class="actions"><button class="btn primary done">${t.status==='done'?'بازگردانی':'انجام شد'}</button><button class="btn edit">ویرایش</button><button class="btn danger del">حذف</button></div>`;c.querySelector('.task-title').textContent=t.title;c.querySelector('.meta').textContent=(t.description?t.description+' · ':'')+fmt(t.due_date);c.querySelector('.done').onclick=()=>toggle(t);c.querySelector('.edit').onclick=()=>openForm(t);c.querySelector('.del').onclick=()=>del(t);return c}
function render(){const now=new Date(),active=tasks.filter(x=>x.status!=='done'),done=tasks.filter(x=>x.status==='done');$('all').textContent=tasks.length;$('done').textContent=done.length;$('today').textContent=active.filter(x=>isToday(localDate(x.due_date))).length;$('overdue').textContent=active.filter(x=>{const d=localDate(x.due_date);return d&&d<now&&!isToday(d)}).length;['attention','todayList','future'].forEach(x=>$(x).innerHTML='');const att=active.filter(x=>{const d=localDate(x.due_date);return d&&d<now}).sort((a,b)=>new Date(a.due_date)-new Date(b.due_date));const tod=active.filter(x=>isToday(localDate(x.due_date)));const fut=active.filter(x=>{const d=localDate(x.due_date);return d&&!isToday(d)&&d>=now}).sort((a,b)=>new Date(a.due_date)-new Date(b.due_date));[[att,'attention','موردی نیست'],[tod,'todayList','کاری برای امروز ثبت نشده'],[fut,'future','کار آینده‌ای نیست']].forEach(([arr,id,empty])=>{if(!arr.length){$(id).innerHTML=`<div class="card empty">${empty}</div>`;return}arr.slice(0,20).forEach(t=>$(id).appendChild(card(t)))})}
async function api(path,opt={}){const h={'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''};const r=await fetch(API_BASE_URL+path,{...opt,headers:{...h,...(opt.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.json()}
async function load(){
  $('status').textContent='در حال اتصال...';
  try{
    if(!tg){
      throw new Error('Telegram WebApp API پیدا نشد؛ Mini App باید از داخل تلگرام باز شود.');
    }
    if(!tg.initData){
      throw new Error('Telegram initData خالی است؛ تلگرام اطلاعات احراز هویت Mini App را ارسال نکرده است.');
    }
    const data=await api('/tasks');
    if(!data || !Array.isArray(data.tasks)){
      throw new Error('پاسخ Worker معتبر نیست: '+JSON.stringify(data));
    }
    tasks=data.tasks;
    $('status').textContent='متصل';
    const u=tg.initDataUnsafe?.user;
    if(u)$('hello').textContent=`سلام ${u.first_name||''} 👋`;
    else $('hello').textContent='از داخل تلگرام باز شده';
    render();
  }catch(e){
    console.error('Mini App diagnostic error:',e);
    $('status').textContent='خطا';
    showNotice('خطای واقعی:\n'+(e?.message||String(e)));
    render();
  }
}
async function toggle(t){try{await api('/tasks/'+t.id,{method:'PATCH',body:JSON.stringify({status:t.status==='done'?'pending':'done'})});await load()}catch(e){showNotice('ثبت وضعیت انجام نشد.')}}
async function del(t){if(!confirm('این کار حذف شود؟'))return;try{await api('/tasks/'+t.id,{method:'DELETE'});await load()}catch(e){showNotice('حذف انجام نشد.')}}
function openForm(t=null){$('modal').classList.add('show');$('formTitle').textContent=t?'ویرایش کار':'ثبت کار جدید';$('editId').value=t?.id||'';$('title').value=t?.title||'';$('description').value=t?.description||'';$('priority').value=t?.priority||'normal';if(t?.due_date){const d=new Date(t.due_date);$('due').value=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}else $('due').value=''}
function closeForm(){$('modal').classList.remove('show')}
$('add').onclick=()=>openForm();$('close').onclick=closeForm;$('form').onsubmit=async e=>{e.preventDefault();const id=$('editId').value;const due=$('due').value?new Date($('due').value).toISOString():null;const body={title:$('title').value.trim(),description:$('description').value.trim(),priority:$('priority').value,due_date:due};try{if(id)await api('/tasks/'+id,{method:'PATCH',body:JSON.stringify(body)});else await api('/tasks',{method:'POST',body:JSON.stringify(body)});closeForm();await load()}catch(e){showNotice('ذخیره انجام نشد.')}};load();
</script>
</body></html>
