<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>داشبورد کارهای من</title>
<style>
:root{--bg:#0b0f16;--card:#121925;--card2:#172131;--text:#f4f7fb;--muted:#93a0b3;--line:#243044;--accent:#7c5cff;--danger:#ff5d6c;--warn:#ffb648;--ok:#39d98a;}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#1b1730 0,#0b0f16 38%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}.app{max-width:760px;margin:auto;padding:22px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.eyebrow{color:#9e8cff;font-size:12px;margin-bottom:5px}.title{font-size:24px;font-weight:800}.subtitle{color:var(--muted);font-size:13px;margin-top:6px}.avatar{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#8d75ff,#4b36c9);display:grid;place-items:center;font-weight:800;box-shadow:0 12px 35px #0006}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.stat{background:linear-gradient(145deg,#151e2d,#101722);border:1px solid var(--line);border-radius:18px;padding:15px}.stat b{display:block;font-size:23px;margin-bottom:4px}.stat span{color:var(--muted);font-size:12px}.section{margin-top:22px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-head h2{font-size:16px;margin:0}.section-head small{color:var(--muted)}.task{background:rgba(18,25,37,.92);border:1px solid var(--line);border-radius:17px;padding:14px 15px;margin:9px 0;display:flex;gap:12px;align-items:flex-start}.check{width:23px;height:23px;border:2px solid #56657d;border-radius:8px;flex:none;margin-top:2px;cursor:pointer}.task.done{opacity:.55}.task.done .check{background:var(--ok);border-color:var(--ok)}.task.done .name{text-decoration:line-through}.name{font-size:14px;font-weight:700;line-height:1.7}.meta{display:flex;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:5px}.pill{padding:3px 8px;border-radius:999px;background:#202b3c}.danger{color:var(--danger)}.warning{color:var(--warn)}.empty{border:1px dashed #334156;border-radius:17px;padding:25px;text-align:center;color:var(--muted)}.fab{position:fixed;bottom:22px;right:50%;transform:translateX(50%);border:0;border-radius:18px;padding:14px 24px;background:linear-gradient(135deg,#8c74ff,#5b43df);color:white;font-size:14px;font-weight:800;box-shadow:0 15px 40px #0008;cursor:pointer}.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center}.sheet{width:min(760px,100%);background:#121925;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px}.sheet input,.sheet textarea{width:100%;margin:7px 0;padding:13px;border-radius:13px;border:1px solid var(--line);background:#0c121b;color:white;font-family:inherit}.sheet button{width:100%;padding:13px;border:0;border-radius:13px;background:var(--accent);color:white;font-weight:800;margin-top:7px}.close{background:#253044!important}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1b2637;border:1px solid var(--line);padding:10px 15px;border-radius:12px;display:none;font-size:12px}@media(min-width:700px){.app{padding-top:35px}.overlay{align-items:center}.sheet{border-radius:24px;max-width:560px}}
</style></head>
<body>
<div class="app">
  <div class="top"><div><div class="eyebrow">PERSONAL COMMAND CENTER</div><div class="title">داشبورد کارهای من</div><div class="subtitle" id="hello">در حال بارگذاری...</div></div><div class="avatar" id="avatar">A</div></div>
  <div class="stats"><div class="stat"><b id="all">0</b><span>کل کارها</span></div><div class="stat"><b id="today">0</b><span>امروز</span></div><div class="stat"><b id="late">0</b><span class="danger">عقب‌افتاده</span></div></div>
  <div class="section"><div class="section-head"><h2>🔴 نیاز به توجه</h2><small id="lateCount"></small></div><div id="lateList"></div></div>
  <div class="section"><div class="section-head"><h2>☀️ امروز</h2><small id="todayCount"></small></div><div id="todayList"></div></div>
  <div class="section"><div class="section-head"><h2>📆 آینده</h2><small id="futureCount"></small></div><div id="futureList"></div></div>
</div>
<button class="fab" onclick="openAdd()">＋ ثبت کار جدید</button>
<div class="overlay" id="overlay"><div class="sheet"><h3>ثبت کار جدید</h3><input id="title" placeholder="عنوان کار"><textarea id="desc" rows="3" placeholder="توضیحات (اختیاری)"></textarea><input id="due" type="datetime-local"><button onclick="addTask()">ثبت کار</button><button class="close" onclick="closeAdd()">انصراف</button></div></div>
<div class="toast" id="toast"></div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
let data={tasks:[]};
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(t){const d=t.due_date?new Date(t.due_date.replace(' ','T')):null;const overdue=d&&d<new Date()&&!t.done;const meta=[];if(d&&!isNaN(d))meta.push('🕐 '+d.toLocaleString('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}));if(t.priority&&t.priority!=='normal')meta.push(t.priority==='very_high'?'🔴 خیلی مهم':'🟠 مهم');return `<div class="task ${t.done?'done':''}"><div class="check" onclick="complete(${t.id})">${t.done?'✓':''}</div><div><div class="name ${overdue?'danger':''}">${esc(t.title)}</div><div class="meta">${meta.map(x=>`<span class="pill">${x}</span>`).join('')}</div></div></div>`}
function render(){const ts=data.tasks||[];document.getElementById('all').textContent=ts.filter(t=>!t.done).length;document.getElementById('today').textContent=ts.filter(t=>t.group==='today'&&!t.done).length;document.getElementById('late').textContent=ts.filter(t=>t.group==='late'&&!t.done).length;['late','today','future'].forEach(g=>{const a=ts.filter(t=>t.group===g&&!t.done);document.getElementById(g+'List').innerHTML=a.length?a.map(card).join(''):'<div class="empty">موردی برای نمایش نیست ✨</div>';document.getElementById(g+'Count').textContent=a.length?`${a.length} مورد`:''})}
async function api(path,opt={}){opt.headers={'Content-Type':'application/json','X-Telegram-Init-Data':(tg?.initData||''),...(opt.headers||{})};const r=await fetch(path,opt);const j=await r.json();if(!r.ok)throw new Error(j.error||'خطا');return j}
async function load(){try{data=await api('/api/tasks'+(location.search||''));const u=data.user||{};document.getElementById('hello').textContent=`${u.first_name||'سلام'}، امروز ${new Date().toLocaleDateString('fa-IR')}`;document.getElementById('avatar').textContent=(u.first_name||'A')[0];render()}catch(e){toast(e.message)}}
async function complete(id){try{await api('/api/tasks/'+id,{method:'PATCH',body:JSON.stringify({done:true})});await load()}catch(e){toast(e.message)}}
function openAdd(){document.getElementById('overlay').style.display='flex'}function closeAdd(){document.getElementById('overlay').style.display='none'}
async function addTask(){const title=document.getElementById('title').value.trim();if(!title)return toast('عنوان کار را وارد کن');const due=document.getElementById('due').value;try{await api('/api/tasks',{method:'POST',body:JSON.stringify({title,description:document.getElementById('desc').value,due_date:due?due.replace('T',' ')+':00':null,priority:'normal'})});document.getElementById('title').value='';document.getElementById('desc').value='';closeAdd();await load();toast('کار ثبت شد ✓')}catch(e){toast(e.message)}}
load();
</script>
</body></html>
